[package]
name = "tongsuo-src"
version = "850.1.0+8.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/VEY-OSS/tongsuo-src-rs"
description = """
Source of Tongsuo and logic to build it.
"""
exclude = [
  '.github',
  '.gitignore',
  '.gitmodules',
  'ci',

  'tongsuo/.gitattributes',

  'tongsuo/test',
  'tongsuo/fuzz',
  'tongsuo/rpm',
  'tongsuo/validation-android.png',

  'tongsuo/util/perl/OpenSSL/Test',

  # required files
  '!tongsuo/**/build.info',
]

[features]
default = []
# Forces configuring Engine module support.
force-engine = []
# Enable kTLS support
ktls = []
# Disable DSO API support
no-dso = []

[workspace]
members = ['testcrate']
exclude = ['target']

[dependencies]
cc = "1.0.79"
